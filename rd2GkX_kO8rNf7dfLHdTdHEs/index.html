<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Сканер штрихкодов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
               font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  #status { text-align: center; padding: 14px 10px; font-size: 16px; }
  #reader { width: 100%; }
  #reader video { object-fit: cover; }
</style>
</head>
<body>
<div id="status">Наведите камеру на штрихкод продукта</div>
<div id="reader"></div>
<script>
  // This page is NOT the bot's backend -- it has none. It only decodes a
  // barcode from the live camera feed in-browser and hands the raw digits
  // back to the bot via Telegram's own WebApp bridge (sendData), exactly as
  // if the user had typed that barcode as a text message. The bot (and
  // Open Food Facts lookup) do all the real work on the other end.
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const statusEl = document.getElementById("status");
  let sent = false;

  function onScanSuccess(decodedText) {
    if (sent) return;
    sent = true;
    statusEl.textContent = "Найдено: " + decodedText;
    tg.sendData(decodedText);
    setTimeout(() => tg.close(), 300);
  }

  const scanner = new Html5Qrcode("reader");
  const scanConfig = {
    fps: 10,
    // A fixed box was too small/too wide-only for square QR codes -- scale
    // the viewfinder to most of the actual camera preview instead, so both
    // square QR codes and long rectangular barcodes fit comfortably.
    qrbox: (viewfinderWidth, viewfinderHeight) => {
      const size = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.85);
      return { width: size, height: size };
    },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.QR_CODE,
    ],
    // Focus/resolution hints go here, NOT in the first start() argument --
    // html5-qrcode requires that first argument to have exactly one key
    // when passed as an object (it failed with "'cameraIdOrConfig' object
    // should have exactly 1 key ... found 5 keys" when they were bundled
    // together). videoConstraints is the library's dedicated slot for extra
    // MediaTrackConstraints like these.
    videoConstraints: {
      focusMode: "continuous",
      advanced: [{ focusMode: "continuous" }],
      width: { ideal: 1920 },
      height: { ideal: 1080 },
    },
  };

  // Pinning a specific deviceId (via getCameras()/enumerateDevices()) broke
  // in Telegram's in-app WebView: device ids/labels often come back empty
  // until camera permission has already been granted once for this exact
  // page -- a chicken-and-egg deviceId mismatch that failed with "no camera
  // access" on the very first run. facingMode lets the browser pick the
  // right physical camera itself, no enumeration/id needed. This object
  // must have exactly one key -- see the videoConstraints note above.
  // A bare string ("environment") is only a hint -- some WebViews (this one
  // included, per live test) ignore it and default to the front camera.
  // {exact: "environment"} forces the back camera; phones always have one,
  // so this is safe to require outright.
  const cameraConfig = { facingMode: { exact: "environment" } };
  scanner
    .start(cameraConfig, scanConfig, onScanSuccess)
    .catch((err) => {
      statusEl.textContent = "Нет доступа к камере: " + err;
    });
</script>
</body>
</html>
